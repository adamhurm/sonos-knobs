# sonos-knobs configuration
# Copy this file to config.yaml and fill in your values.

remote:
  # "nuimo" or "ortho"
  type: nuimo

  # Optional: connect to a specific BLE device by ID.
  # Leave commented out to auto-discover the first available device.
  # deviceId: "XX:XX:XX:XX:XX:XX"

speaker:
  type: sonos

  # ── Single speaker ──────────────────────────────────────────────────────────
  # Uncomment and set the IP address of your Sonos speaker.
  # Find it in the Sonos app: Settings → System → [room] → About My [room].
  # host: 192.168.1.50

  # ── Multiple speakers / zones ────────────────────────────────────────────────
  # List specific IPs to manage. Long-click the knob to cycle through zones.
  # hosts:
  #   - 192.168.1.50   # Living Room
  #   - 192.168.1.51   # Kitchen
  #   - 192.168.1.52   # Bedroom

  # ── Auto-discovery (default when no host/hosts are set) ───────────────────
  # Scans the local network for all Sonos speakers and defaults to whichever
  # is actively playing. Long-click to cycle through all discovered zones.
  # Increase discoveryTimeout (in ms) if speakers are slow to respond.
  # discoveryTimeout: 5000

display:
  # Show the animated SONOS splash on startup (Nuimo only).
  splash: true

  # How long to show status glyphs (play/pause/volume) before clearing, in ms.
  timeout: 5000
